<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Equipe dos Sonhos iFlores</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand-lg">Equipe dos Sonhos <span>iFlores</span></div>
      <p>Este painel abre dentro da iFlores. Para conhecer, abra uma loja de demonstração com dados de exemplo.</p>
      <button class="btn primary" id="btnDemo" type="button">Abrir loja de demonstração</button>
    </div>
  </div>
  <div id="app" hidden>
    <header class="topbar">
      <a class="btn sm" href="/painel" title="Voltar para Minha equipe">← Minha equipe</a>
      <div class="brand">Equipe dos Sonhos <span id="storeName"></span></div>
      <nav id="tabs" class="tabs" aria-label="Seções">
        <a href="#equipe" data-tab="equipe">Equipe</a>
        <a href="#conversar" data-tab="conversar">Conversar</a>
        <a href="#tarefas" data-tab="tarefas">Tarefas <b class="badge" id="bTarefas"></b></a>
        <a href="#atendimento" data-tab="atendimento">Atendimento</a>
        <a href="#crm" data-tab="crm">CRM</a>
        <a href="#conteudo" data-tab="conteudo">Conteúdo <b class="badge" id="bConteudo"></b></a>
        <a href="#anuncios" data-tab="anuncios">Anúncios</a>
        <a href="#financas" data-tab="financas">Finanças</a>
        <a href="#loja" data-tab="loja">Loja</a>
        <a href="#automacoes" data-tab="automacoes">Automações</a>
        <a href="#resultados" data-tab="resultados">Resultados</a>
        <a href="#conectar" data-tab="conectar">Conectar <b class="badge" id="bConectar"></b></a>
        <a href="#configurar" data-tab="configurar">Configurar</a>
      </nav>
      <span class="mode" id="modePill"></span>
    </header>
    <main id="view" class="view"></main>
  </div>
  <dialog id="modal"><form method="dialog" id="modalBody"></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
  <script src="/alertas.js" defer></script>
</body>
</html>
